name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: gitleaks (pinned binary, checksum-verified)
        env:
          GL_VERSION: "8.18.4"
          GL_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
        run: |
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml
  image:
    # builds the service image with an empty store (no client data in this repo) and checks
    # that the app module imports; the real store is added only by the store repo's deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: engine }
      - run: mkdir -p store
      - run: docker build -f engine/Dockerfile -t autolist-ci .
      - run: docker run --rm --entrypoint python autolist-ci -c "import autolist.orchestrator.main, autolist.orchestrator.entrypoints; print('import ok')"
      - name: The service user cannot change its code or store files (L8)
        run: |
          docker run --rm --entrypoint sh autolist-ci -c '
            id -u | grep -qx 10001 || { echo "not the service user"; exit 1; }
            for p in /app/store /app/src /app/.venv; do
              if touch "$p/.probe" 2>/dev/null; then echo "$p is writable"; exit 1; fi
            done
            echo "read-only ok"'
